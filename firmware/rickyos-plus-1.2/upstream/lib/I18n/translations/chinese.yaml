STR_SGM_RULES_1: "基本玩法 · 1/3\n\n黑棋先手，任意方向连成五子或更多即获胜，不设禁手。\n\n每回合落子或发动一个技能。初始 3 能量，上限 8；普通落子增加 1 能量。\n\n点棋盘定位，再确认落子。菜单里可以选技能或悔棋。返回可取消待发动的技能，不扣能量。\n\n棋盘满或累计 400 次行动判和。技能模式与传统模式分别存档。"
STR_SGM_RULES_2: "普通技能 · 2/3\n\n飞沙走石（3 能量）：移除对方一枚棋子。\n\n偷梁换柱（4 能量）：将对方一枚棋子变为己方颜色。\n\n移花接木（2 能量）：选己方棋子并确认，再选空位并确认移动。\n\n这三个技能发动后，需要自己再完成两次行动才可再次使用。选错目标、取消操作不扣能量，不计回合。"
STR_SGM_RULES_3: "强力技能 · 3/3\n\n静如止水（5）：落一子，对方跳过回合，自己继续。\n\n两极反转（6）：交换全部棋子颜色，场上须有双方棋子。\n\n力拔山兮（8）：清空指定 3×3 区域，己方棋子也会移除。\n\n以上技能每位玩家每局各限一次。\n\n休养生息：恢复 3 能量并结束回合。悔棋还原能量、冷却和技能次数，仅保留本次进入后的最近 8 次行动。"
