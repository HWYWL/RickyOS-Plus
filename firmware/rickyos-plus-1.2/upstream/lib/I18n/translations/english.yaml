STR_SGM_RULES_1: "SKILL GOMOKU · 1/3\n\nBlack starts. Connect five or more to win. Each turn: place OR cast.\n\nStart with 3 energy; maximum 8. Normal placement adds 1.\n\nTouch aims; Confirm commits. Menu opens skills and undo. Back cancels an armed skill without spending.\n\nA full board or 400 actions is a draw. Saves are separate from traditional Gomoku."
STR_SGM_RULES_2: "SKILLS · 2/3\n\nFlying sand (3): remove an opponent stone.\n\nSwitch sides (4): convert an opponent stone.\n\nStone shuffle (2): select your stone, confirm; select an empty destination, confirm.\n\nThese skills cool down for your next 2 successful actions. Invalid targets and cancellation cost nothing."
STR_SGM_RULES_3: "POWER SKILLS · 3/3\n\nStill water (5): place, then play again.\n\nPolar reversal (6): swap every stone colour. Requires both colours on the board.\n\nMountain mover (8): clear a 3×3 area, including your stones.\n\nEach power skill is usable once per player per game.\n\nCatch a breath: gain 3 energy, end turn. Undo restores energy, cooldowns and used skills; last 8 actions, this session only."
